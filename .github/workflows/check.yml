name: check

on:
  push:
    branches: [main]
  pull_request:
  # Let a branch be checked on demand (e.g. before opening a PR) without
  # having to push to main first.
  workflow_dispatch:
  # release.yml calls this rather than restating the gate. Publishing to npm,
  # PyPI and crates.io is IRREVERSIBLE — a version number, once taken, can only
  # be superseded — so the bar at a release tag must be the same bar a PR
  # clears, not a re-typed approximation of it that drifts.
  workflow_call:

# A second push to a PR branch makes the first run's answer worthless, and the
# abandoned run still holds a runner — on the macOS ones, a queue slot the next
# PR then waits behind.
#
# Only a PR run is ever in a shared group. Everything else keys on the commit,
# so it gets a group of its own: putting main pushes in one group would
# SERIALIZE them even with cancelling off, and GitHub cancels a *pending* run
# when a newer one joins its group — so three merges inside one build would
# leave the middle commit with no run at all. That is the tick this is
# supposed to protect.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The suite shims `gh` and `lsof` on PATH and builds throwaway repos in a
    # temp dir, so it needs nothing but git, Go and bats — no network, no forge
    # auth, no real checkout. That is also why it runs on both OSes: the
    # occupancy and reflink paths are the ones most likely to diverge.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true           # fsnotify is now a real dependency — see go.mod
      # npm on both runners rather than brew on one and apt on the other: it
      # is preinstalled on every image, and neither of the two it replaces is
      # fast — `brew install` refreshes its own metadata first, and `apt-get
      # update` is the step that hangs rather than fails when the Azure
      # mirrors go quiet.
      - name: install bats
        run: |
          # `sudo` only on Linux: the macOS image's npm prefix belongs to the
          # runner user, and installing as root there leaves root-owned files
          # in it for everything downstream.
          if [ "$RUNNER_OS" = macOS ]; then npm install -g bats
          else sudo npm install -g bats; fi

      # Cheap, and it catches a class of failure nothing else can see: a skill
      # with broken frontmatter installs, lists and is never loaded. Same script
      # nix/skill.nix runs — this job has no Nix (the `nix` job below does), so a
      # guard living only in that derivation would never fire here.
      - name: agent skills
        run: |
          script/check-skills.sh ai scruff

      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./skills.go)" || { gofmt -l ./cmd ./internal ./skills.go; exit 1; }
      - name: vet
        run: go vet ./...

      # The full 0.1 contract. It went green with `reship`, so this is a hard
      # gate now rather than a score — a PR that breaks any of the 77 fails.
      - name: acceptance suite
        run: make test

  # The five SDKs are all in this repo but none of them are in the job above:
  # `go test ./...` can't see sdk/go (its own go.mod, so consumers can `go get`
  # it without inheriting scruff's deps), and ts/python/rust need toolchains the
  # Go job doesn't install. Until this job existed, the only thing keeping five
  # published clients agreeing about one wire format was somebody remembering
  # to run five suites by hand — and every one of them drives the SAME
  # `fake-scruff.sh` fixture, so a divergence is exactly what they catch.
  #
  # Swift is its own job because it wants a macOS runner; the other four share
  # a Linux one.
  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # `stable` is a BRANCH of the action repo, not a version — the same
      # mutable-ref shape `@main` was. dtolnay publishes no release tags, so a
      # commit is the only pin there is. It still installs stable Rust; what is
      # frozen is the action, not the toolchain.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable

      - name: typescript
        working-directory: sdk/ts
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun test
      - name: python
        working-directory: sdk/python
        run: |
          python -m pip install --quiet pytest pytest-asyncio
          PYTHONPATH=src python -m pytest -q
      - name: go
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - name: rust
        working-directory: sdk/rust
        run: cargo test --quiet

  # `vendorHash`, which nothing above can see: `make check` uses the ambient Go
  # toolchain and never reads flake.nix, so a go.mod change that leaves the hash
  # stale is green here and broken for every consumer — the fixed-output
  # derivation only fails once someone rebuilds their machine against the merged
  # commit, and it takes `scruff` out of their system-path rather than failing
  # one package. That is exactly how #94 (the snug re-pin) landed.
  #
  # `.goModules` is the FOD itself, so this is precisely the stale-hash gate and
  # nothing else. Deliberately NOT `.#default`: that runs the derivation's
  # checkPhase, and the bats suite is not hermetic under Linux's sandbox — the
  # `doctor --migrate-base` cases reach for a real lsof and refuse without one.
  # It passes on darwin only because that sandbox is relaxed enough to see
  # /usr/bin/lsof. The suite itself is already gated by the `test` job above, on
  # both OSes; building the full package here would only re-run it worse.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: vendorHash matches go.mod
        run: nix build .#default.goModules --no-link --print-build-logs

  swift-sdk:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift
        working-directory: sdk/swift
        run: swift test
