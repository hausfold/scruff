name: release

# Tag v<semver> (e.g. v0.2.0) -> a GitHub release, plus all six artifacts scruff
# ships, published from one number:
#
#   CLI          the GitHub release + source tarball (Nix consumers take the
#                flake input, Homebrew compiles the tarball; there is still no
#                binary to attach)
#   sdk/ts       npm            @hausfold/scruff
#   sdk/python   PyPI           hausfold-scruff
#   sdk/rust     crates.io      hausfold-scruff
#   sdk/go       a `sdk/go/v<version>` tag — Go's proxy needs nothing else
#   sdk/swift    a tag on the hausfold/scruff-swift mirror — SwiftPM likewise
#
# And one thing that is not an artifact but moves on the same number:
# hausfold/homebrew-tap's `Formula/scruff.rb`, repointed at the new tag's source
# tarball so `brew install hausfold/tap/scruff` is never a release behind.
#
# Cut tags with `bench release scruff <version>` from the workshop; it stamps the
# version everywhere (script/stamp-version.sh), commits, pushes, tags, and then
# watches this run. Never push a v* tag by hand — the stamp commit has to land
# first or the `version stamp` job below rejects the tag.
#
# scruff is semver, not the family's CalVer. See script/stamp-version.sh for why
# (short version: four of these registries already hold semver 0.1.0, and a
# published version can never be taken back).
#
# ── One-time setup, per registry ──────────────────────────────────────────────
# Every publish here authenticates by OIDC — no long-lived tokens, no 2FA
# prompt, and npm/PyPI get build provenance for free. Each registry has to be
# told to trust this repo + workflow ONCE, in a browser:
#
#   npm       npmjs.com -> @hausfold/scruff -> Settings -> Trusted Publisher
#             GitHub Actions, org `hausfold`, repo `scruff`, workflow `release.yml`
#   PyPI      pypi.org -> hausfold-scruff -> Publishing -> Add a trusted publisher
#             owner `hausfold`, repo `scruff`, workflow `release.yml`
#   crates.io crates.io -> hausfold-scruff -> Settings -> Trusted Publishing
#             repo `hausfold/scruff`, workflow `release.yml`
#
# Two pushes here are to ANOTHER repo, which is outside what OIDC or this
# workflow's GITHUB_TOKEN can ever be scoped to, so each needs a credential of
# its own:
#
#   tap       a read-write DEPLOY KEY on hausfold/homebrew-tap, private half
#             stored here as the repo secret TAP_DEPLOY_KEY. One keypair per
#             releasing repo — pounce and perch each have their own, named
#             "<repo> release workflow (TAP_DEPLOY_KEY)" on the tap — so that
#             revoking one repo's access never touches the others.
#
#   mirror    a fine-grained PAT with Contents: read+write on
#             hausfold/scruff-swift, stored here as the repo secret
#             MIRROR_TOKEN. A deploy key would do as well; the PAT predates
#             the tap job and there is no reason to churn it.
#
# Until a registry is wired, its job fails and the others still publish — the
# jobs are deliberately independent, and every one of them is idempotent, so
# `gh run rerun --failed` finishes the release rather than half-cutting a second
# one.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Does the tree at this tag actually claim to be this version? bench stamps it
  # before tagging, so this only fires on a hand-pushed tag or a botched stamp —
  # which is exactly when you want it to.
  stamp:
    name: version stamp
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          script/stamp-version.sh --check "$V"

  # The full PR gate, reused verbatim (see check.yml's `workflow_call`): the Go
  # acceptance suite on both OSes, all five SDK suites against the shared
  # fake-scruff fixture, and the Swift suite on macOS.
  check:
    uses: ./.github/workflows/check.yml

  github-release:
    needs: [stamp, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — leaving it alone"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

  npm:
    name: npm (sdk/ts)
    needs: [stamp, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # the OIDC token npm trades for publish rights
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # setup-node's bundled npm predates trusted publishing; without this the
      # publish falls back to looking for an _authToken it will never find.
      - run: npm install -g npm@latest
      - name: build
        working-directory: sdk/ts
        run: |
          bun install --frozen-lockfile
          bunx tsc -p tsconfig.json
      - name: publish
        working-directory: sdk/ts
        run: |
          V="${{ needs.stamp.outputs.version }}"
          if npm view "@hausfold/scruff@$V" version >/dev/null 2>&1; then
            echo "@hausfold/scruff@$V is already on npm — nothing to do"
            exit 0
          fi
          npm publish --access public

  pypi:
    name: PyPI (sdk/python)
    needs: [stamp, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: build sdist + wheel
        working-directory: sdk/python
        run: |
          python -m pip install --quiet build
          python -m build
      # `release/v1` is a branch. This job holds `id-token: write` against
      # PyPI, which makes it the worst place in the repo for a floating ref.
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: sdk/python/dist
          skip-existing: true     # makes a rerun a no-op, not a 400

  crates:
    name: crates.io (sdk/rust)
    needs: [stamp, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # `stable` is a BRANCH of the action repo, not a version — the same
      # mutable-ref shape `@main` was. dtolnay publishes no release tags, so a
      # commit is the only pin there is. It still installs stable Rust; what is
      # frozen is the action, not the toolchain.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
      - name: already published?
        id: pub
        run: |
          V="${{ needs.stamp.outputs.version }}"
          if curl -sf -H 'User-Agent: hausfold-scruff-release' \
               "https://crates.io/api/v1/crates/hausfold-scruff/$V" >/dev/null; then
            echo "hausfold-scruff $V is already on crates.io — nothing to do"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.pub.outputs.skip != '1'
        id: auth
      - name: publish
        if: steps.pub.outputs.skip != '1'
        working-directory: sdk/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

  go-sdk:
    name: go (sdk/go tag)
    needs: [stamp, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write            # pushes the module tag into this repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # There is no registry to publish to: a Go module IS its tag. sdk/go has
      # its own go.mod, so the tag carries the subdirectory as a prefix —
      # `sdk/go/v0.2.0`, not `v0.2.0` — which is what makes
      # `go get github.com/hausfold/scruff/sdk/go@v0.2.0` resolve.
      - name: tag the module
        run: |
          # An annotated tag needs a tagger; actions/checkout doesn't set one.
          git config user.name  haus-release
          git config user.email haus-release@users.noreply.github.com
          V="${{ needs.stamp.outputs.version }}"
          TAG="sdk/go/v$V"
          if git ls-remote --tags --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — nothing to do"
          else
            git tag -a "$TAG" -m "sdk/go $V"
            git push origin "$TAG"
          fi
      # Warm the module proxy so the first `go get` after a release is instant
      # rather than a cold fetch, and so a broken module surfaces HERE.
      - name: verify through the proxy
        run: |
          V="${{ needs.stamp.outputs.version }}"
          cd "$(mktemp -d)" && go mod init probe
          for _ in 1 2 3 4 5; do
            GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod \
              go get "github.com/hausfold/scruff/sdk/go@v$V" && exit 0
            echo "proxy hasn't seen v$V yet — retrying in 20s"; sleep 20
          done
          exit 1

  swift:
    name: SwiftPM (scruff-swift mirror)
    needs: [stamp, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0         # subtree split walks the whole history
          persist-credentials: false
      - name: mirror + tag
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::MIRROR_TOKEN is unset — see this workflow's header for how to mint it." >&2
            exit 1
          fi
          git config user.name  haus-release
          git config user.email haus-release@users.noreply.github.com
          MIRROR_URL="https://x-access-token:$MIRROR_TOKEN@github.com/hausfold/scruff-swift.git" \
            sdk/swift/sync-mirror.sh --tag "${{ needs.stamp.outputs.version }}"

  bump-tap:
    name: bump hausfold/homebrew-tap
    needs: [stamp, github-release]
    runs-on: ubuntu-latest
    steps:
      # actions/checkout turns a missing ssh-key into a git authentication
      # failure against a public repo, which reads as anything but "the secret
      # was never added". Say it plainly instead — this is the shape a fresh
      # fork of scruff hits, and the header above is the fix.
      - name: Is the deploy key here?
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          [ -n "$TAP_DEPLOY_KEY" ] || {
            echo "::error::TAP_DEPLOY_KEY is unset — see this workflow's header for how to mint it." >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          repository: hausfold/homebrew-tap
          # Write deploy key for the tap repo, stored as a secret here. The
          # formula's url/sha256 lines are CI-owned; humans never bump them.
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Point Formula/scruff.rb at the new tag
        run: |
          TAG="$GITHUB_REF_NAME"
          VER="${{ needs.stamp.outputs.version }}"

          # Bootstrapping order, once: the tap gets the formula by hand (its
          # AGENTS.md allows exactly that), and this job takes over from the
          # next release. Exiting 0 here means a tap that has not adopted
          # scruff yet can never turn a published release red.
          if [ ! -f Formula/scruff.rb ]; then
            # ...but "absent" has a second meaning once the bootstrap is done:
            # the formula moved. Homebrew's sharded `Formula/s/scruff.rb`
            # layout is legal in a tap, and a rename or a shard would otherwise
            # leave a GREEN release beside a tap frozen on the old tag — the
            # worst outcome this job has, and the one no guard below can catch.
            if find . -name scruff.rb -not -path './.git/*' | grep -q .; then
              echo "::error::the tap has a scruff formula somewhere other than Formula/scruff.rb — this job's path is stale, fix it here"
              exit 1
            fi
            echo "::notice::Formula/scruff.rb is not in the tap yet — bootstrap it by hand once, and this job keeps it current from the next release."
            exit 0
          fi

          # GitHub generates this tarball on demand rather than storing it, and
          # its bytes are only *promised* stable, not immutable the way a
          # release asset is. The alternative is attaching our own source
          # tarball and hashing that, which buys immutability and costs a
          # second artifact to keep true; homebrew-core takes this same URL for
          # thousands of formulae, so we do too, and we hash whatever it served
          # us right here rather than trusting a value computed anywhere else.
          URL="https://github.com/hausfold/scruff/archive/refs/tags/$TAG.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/scruff-src.tar.gz "$URL"

          # `curl -f` reads the status line, not the body: a truncated transfer
          # or a redirect that served something else still hashes cleanly, and
          # a wrong sha256 here means every `brew install hausfold/tap/scruff`
          # fails a checksum until someone notices. Ask the archive for a file
          # only scruff's tree has, at the path GitHub names it.
          tar -tzf /tmp/scruff-src.tar.gz "scruff-$VER/go.mod" >/dev/null || {
            echo "::error::$URL did not serve scruff $VER's source tree"
            exit 1
          }

          SHA="$(sha256sum /tmp/scruff-src.tar.gz | cut -d' ' -f1)"

          # Both patterns are anchored at BOTH ends, and that is the whole
          # promise the tap's AGENTS.md makes about this sed: it rewrites a
          # bare `url "…"` line or it rewrites nothing. A line that grew a
          # second argument (`, using: :homebrew_curl`, a git url's `tag:` and
          # `revision:`) would otherwise have that argument silently deleted,
          # and the guards below would still pass because the new URL is there.
          # Unanchored, the greedy `.*` eats it; anchored, the sed no-ops and
          # the guards fail loudly, which is what they are for.
          sed -i -E \
            -e "s#^  url \"[^\"]*\"\$#  url \"$URL\"#" \
            -e "s#^  sha256 \"[^\"]*\"\$#  sha256 \"$SHA\"#" \
            Formula/scruff.rb

          grep -qxF "  url \"$URL\"" Formula/scruff.rb || {
            echo "::error::formula url did not move to $TAG — its shape changed, fix it by hand"
            exit 1
          }
          grep -qxF "  sha256 \"$SHA\"" Formula/scruff.rb || {
            echo "::error::formula sha256 did not move — its shape changed, fix it by hand"
            exit 1
          }
          # A `version` line would now disagree with the URL on every release,
          # and Homebrew reads the URL. There has never been one; this is the
          # guard that keeps a well-meaning hand-edit from adding one.
          if grep -qE '^  version "' Formula/scruff.rb; then
            echo "::error::Formula/scruff.rb grew a version line — Homebrew scans it from the url, and the two will drift"
            exit 1
          fi

          if git diff --quiet; then
            echo "formula already current"
            exit 0
          fi
          git config user.name "haus-release[bot]"
          git config user.email "haus-release@users.noreply.github.com"
          git commit -am "scruff ${VER}"
          # pounce's and perch's releases push to this same branch, and one of
          # them landing between our checkout and this push rejects it. Rebase
          # once and retry, rather than ending a green release with a formula
          # still on the old tag.
          git push || { git pull --rebase origin main && git push; }
