<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="2048" height="2048">
  <!-- scruff, the inverted tile. A lane per agent, the one you're in lit.
       Source of record for this mark: the PNGs beside it render from this file.
       Shapes, colour roles and the rules they answer to are in the brand kit's
       docs/design.md, under Components. The ears are the family path, used
       verbatim: move, scale or recolour them, never redraw them.
       The two parked lanes sit on the tile ground rather than on another
       shape, so they dim to surface0 at 0.45 instead of stepping darker. -->
  <clipPath id="scruff-inv-tile"><rect width="100" height="100" rx="24"/></clipPath>
  <g clip-path="url(#scruff-inv-tile)">
    <rect width="100" height="100" fill="#e6a3ad"/>
    <g fill="#343434" transform="translate(14 4) scale(0.72)">
      <path d="M 18 13 Q 34 18 47 24 Q 34 35 30.5 57 Q 20 34 18 13 Z"/>
      <path d="M 82 13 Q 66 18 53 24 Q 66 35 69.5 57 Q 80 34 82 13 Z"/>
    </g>
    <rect x="21" y="56" width="14" height="32" rx="7" fill="#343434" opacity="0.45"/>
    <rect x="43" y="56" width="14" height="32" rx="7" fill="#343434"/>
    <rect x="65" y="56" width="14" height="32" rx="7" fill="#343434" opacity="0.45"/>
  </g>
</svg>
