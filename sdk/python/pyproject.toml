[project]
name = "hausfold-scruff"
version = "1.3.5"
description = "Python SDK for scruff, the worktree-lifecycle substrate. Shells out to the scruff binary; async-first so it drops into a FastAPI/asyncio backend or a script equally."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "hausfold" }]
classifiers = [
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/hausfold/scruff"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scruff"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
